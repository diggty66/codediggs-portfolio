name: Temporary UQCP v8 metadata update

on:
  push:
    branches: [content/update-uqcp-v8-zenodo]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: content/update-uqcp-v8-zenodo

      - name: Update original UQCP publication card to v8
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()
          marker = "doi: '10.5281/zenodo.22738479'"
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('Original UQCP publication DOI was not found')
          start = text.rfind('  {', 0, pos)
          end = text.find('  },', pos)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the original UQCP publication object boundaries')
          end += len('  },')
          new = (
              "  {\n"
              "    title:\n"
              "      'Unified Quantum Consciousness Postulation (UQCP) v8 — Driven Microtubular Near-Field Transduction Revision: A Field- and Frequency-Modulated Nanoscale Transport Hypothesis with Conditional Consciousness Extensions',\n"
              "    author: 'John Giles',\n"
              "    issued: 'October 2026',\n"
              "    version: '8.0',\n"
              "    resourceType: 'Publication',\n"
              "    description:\n"
              "      'A revised theoretical postulation and experimental proposal centered on a Driven Microtubular Near-Field Transduction Array, narrowing the physical model to chromophore-mediated transport through the tubulin lattice and treating electrical, mechanical/acoustic, and magnetic perturbations as testable modulation axes while keeping broader consciousness claims conditional.',\n"
              "    doi: '10.5281/zenodo.23146512',\n"
              "    url: 'https://zenodo.org/records/23146512',\n"
              "    tags: ['UQCP', 'Microtubules', 'Near-Field Optics', 'Anisotropic Transport', 'Nanophotonics', 'Consciousness'],\n"
              "  },"
          )
          updated = text[:start] + new + text[end:]
          if updated.count("10.5281/zenodo.23146512") != 1:
              raise SystemExit('New UQCP DOI validation failed')
          if "10.5281/zenodo.22738479" in updated:
              raise SystemExit('Old UQCP DOI remained after replacement')
          path.write_text(updated)
          PY

      - name: Commit publication update
        run: |
          git config user.name "CodeDiggs"
          git config user.email "CodeDiggs@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Update original UQCP publication to Zenodo v8"
          git push origin HEAD:content/update-uqcp-v8-zenodo
