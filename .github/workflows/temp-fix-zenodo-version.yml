name: Temporary Zenodo version correction

on:
  push:
    branches: [fix/zenodo-uqcp-version-v1-1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/zenodo-uqcp-version-v1-1

      - name: Correct Zenodo version metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()
          marker = "doi: '10.5281/zenodo.23146512'"
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('Target Zenodo DOI not found')
          start = text.rfind('  {', 0, pos)
          end = text.find('  },', pos)
          if start < 0 or end < 0:
              raise SystemExit('Target publication object boundaries not found')
          end += len('  },')
          block = text[start:end]
          old = "version: '8.0'"
          new = "version: 'v1.1'"
          if block.count(old) != 1:
              raise SystemExit(f'Expected exactly one {old!r} in target publication block, found {block.count(old)}')
          block = block.replace(old, new)
          updated = text[:start] + block + text[end:]
          if updated.count("version: 'v1.1'") < 1:
              raise SystemExit('Version replacement validation failed')
          path.write_text(updated)
          PY

      - name: Commit correction
        run: |
          git config user.name "CodeDiggs"
          git config user.email "CodeDiggs@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Correct UQCP Zenodo version to v1.1"
          git push origin HEAD:fix/zenodo-uqcp-version-v1-1
